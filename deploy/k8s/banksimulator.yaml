          ports: [ { containerPort: 8080 } ]
          env:
            - { name: ASPNETCORE_URLS, value: "http://+:8080" }
            - { name: "ConnectionStrings__saribankDb", value: "Host=postgres;Port=5432;Username=postgres;Password=BankSim2026;Database=saribankDb" }
            - { name: "ConnectionStrings__rabbitmq", value: "amqp://guest:guest@rabbitmq:5672" }
---
apiVersion: v1
kind: Service
metadata: { name: saribank-api, namespace: banksim }
spec: { selector: { app: saribank-api }, ports: [ { port: 8080, targetPort: 8080 } ] }
---
# ── TuruncuBank (TuruncuXml protokolü) ──
apiVersion: apps/v1
kind: Deployment
metadata: { name: turuncubank-api, namespace: banksim }
spec:
